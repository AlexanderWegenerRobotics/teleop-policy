dataset_config: configs/dataset.yaml

model:
  hidden_dim: 512
  latent_dim: 32
  nheads: 8
  enc_layers: 4
  dec_layers: 7
  dim_feedforward: 3200
  dropout: 0.1

train:
  lr: 1.0e-5
  batch_size: 8
  epochs: 2000
  kl_weight: 10.0
  num_workers: 4
  log_every: 50
  ckpt_every: 100
  ckpt_keep_last: 3
  val_stride: 10
  ckpt_dir: checkpoints/act_sorting_head
  seed: 0
