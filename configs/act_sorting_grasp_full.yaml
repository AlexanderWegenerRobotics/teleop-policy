# Experiment C -- grasp oversampling at the FULL epoch budget.
#
# What the first two experiments settled:
#
#   deployed (2000ep, uniform)   best val L1 0.1205   reaches, rarely grasps
#   A (600ep, uniform)           best val L1 0.1689   "moved there, did nothing"
#   B (600ep, oversample 5)      best val L1 0.1780   decisive, fingers closed,
#                                                     carried toward the bin
#
# Two conclusions. First, 600 epochs is undertrained: the original run's val L1
# kept descending past it (0.167 @400 -> 0.145 @1800, best 0.1205), so cutting
# the budget cost real quality -- both A and B are worse on val than the model
# already deployed. Second, and more useful: B had the WORST val L1 of the
# three and the BEST behaviour. Overall val L1 averages 20 action dims across
# every timestep, and the grasp pose is 1.65% of engaged frames, so it is
# dominated by transit and can move opposite to task success.
#
# So: keep B's sampling, restore the full budget, and select on the new
# l1_grasp metric (see train.py's val_grasp_loader) rather than l1. Both
# best.pt (l1) and best_grasp.pt (l1_grasp) are written -- compare them in the
# sim replay; if they disagree, l1_grasp should be the better robot.
#
#   python scripts/train.py configs/act_sorting_grasp_full.yaml
#   ~41 min at 1.2 s/epoch
#
# Disk: ~2.5GB of snapshots + 1.3GB latest.pt. The volume was at 95% (51GB
# free) -- clear an old ckpt_dir first if that has not improved.

dataset_config: configs/dataset.yaml

dataset_overrides:
  sampling:
    grasp_oversample: 5.0
    grasp_window_s: 1.5

model:
  hidden_dim: 512
  latent_dim: 32
  nheads: 8
  enc_layers: 4
  dec_layers: 7
  dim_feedforward: 3200
  dropout: 0.1

train:
  lr: 1.0e-5
  batch_size: 8
  epochs: 2000
  kl_weight: 10.0
  num_workers: 4
  log_every: 50
  ckpt_every: 100         # 20 val evals over the run -- enough to see the
                          # l1_grasp curve's shape, not just its endpoint
  ckpt_keep_last: 6
  ckpt_dir: checkpoints/act_sorting_grasp_full
  seed: 0
  n_train_episodes: null
