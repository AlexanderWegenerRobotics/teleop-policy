data:
  store_root: C:/Users/ceti/Documents/05_data/teleop-sorting_v2/avatar
  episode_file: episode_policy.hdf5
  splits: data/splits
  include_success: [success, partial]

alignment:
  rate_hz: 20.0
  method: nearest_neighbor

cameras:
  use: [wrist_cam_left, wrist_cam_right, head_cam_left]
  resize_to: [240, 320]

state:
  train_states: [4]

proprio:
  source: observations/arm_{side}/O_T_EE_world
  gripper: observations/arm_{side}/gripper_width
  dims_per_arm: 10
  arms: [arm_left, arm_right]

action:
  source: actions/arm_{side}/O_T_EE_cmd_world
  gripper: actions/arm_{side}/gripper_cmd
  dims_per_arm: 10
  arms: [arm_left, arm_right]
  chunk_size: 40

head:
  use: true
  proprio: observations/head/q
  action: observations/head/q_cmd

normalize:
  method: zero_mean_unit_var
  stats_file: dataset/stats_head.npz
