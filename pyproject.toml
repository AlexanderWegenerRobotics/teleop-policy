[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "teleop-policy"
version = "0.1.0"
description = "ACT imitation-learning policy for bimanual teleoperation."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "numpy",
]

[tool.setuptools]
packages = [
    "teleop_policy",
    "teleop_policy.models",
    "teleop_policy.models.act",
    "teleop_policy.dataset",
]

[tool.setuptools.package-dir]
teleop_policy = "."
